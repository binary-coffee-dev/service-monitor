[package]
name = "service_monitor"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "service_monitor"
path = "src/main.rs"

[lib]
name = "sm"
path = "src/lib.rs"

[dependencies]
base64 = "0.22.0"
warp = "0.3.6"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.28.2", features = ["full"] }
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0"
checkssl = "0.2.0"

[dev-dependencies]
mockito = "1.7.1"
